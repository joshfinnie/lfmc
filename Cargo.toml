[package]
name = "lfmc"
version = "1.0.0"
edition = "2021"

[dependencies]
# CLI
clap = { version = "4.6", features = ["derive", "env"] }
dirs = "6.0"
dotenv = "0.15"

# Async runtime
tokio = { version = "1.50", features = ["full"] }

# HTTP client with retry
reqwest = { version = "0.13", features = ["json"] }
reqwest-middleware = "0.5"
reqwest-retry = "0.9"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.4"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# URL encoding
urlencoding = "2.1"

# Date/time
chrono = "0.4"

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"
assert_cmd = "2.2"
predicates = "3.1"
tempfile = "3.27"
